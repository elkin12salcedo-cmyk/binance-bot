services:
  - type: web
    name: binance-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot:app
    envVars:
      - key: MODE
        value: futures
      - key: SYMBOLS
        value: BTCUSDT,ETHUSDT
      - key: INTERVAL
        value: 15m
      - key: CHECK_SECONDS
        value: "60"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
